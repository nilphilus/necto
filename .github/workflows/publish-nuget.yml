name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.3.1 or 0.4.0-preview.1)'
        required: true
        type: string
      publish:
        description: 'Publish to nuget.org'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-nuget-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          if [[ ! "$PACKAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Enter a package version such as 0.3.1 or 0.4.0-preview.1"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - run: dotnet test Generator.Tests/Generator.Tests.csproj -c Release
      - run: dotnet test Tests/Tests.csproj -c Release
      - run: dotnet pack Necto/Necto.csproj -c Release -p:PackageVersion="$PACKAGE_VERSION" -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/Necto.OpenApi.*.nupkg
          if-no-files-found: error

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/Necto.OpenApi.*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
