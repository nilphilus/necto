name: Deploy website and live demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/landing-page/**'
      - 'Necto.UI/**'
      - 'Necto/**'
      - 'Necto.Generator/**'
      - 'SampleApi.FastEndpoints/**'
      - 'tools/capture-fastendpoints-demo.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Build website and live demo
        run: |
          dotnet build SampleApi.FastEndpoints/SampleApi.FastEndpoints.csproj --configuration Release
          mkdir -p "$RUNNER_TEMP/necto-pages"
          cp -a docs/landing-page/. "$RUNNER_TEMP/necto-pages/"
          pnpm --dir Necto.UI run build --mode live-demo --outDir "$RUNNER_TEMP/necto-pages/demo" --emptyOutDir
          python3 tools/capture-fastendpoints-demo.py \
            --assembly SampleApi.FastEndpoints/bin/Release/net10.0/SampleApi.FastEndpoints.dll \
            --output "$RUNNER_TEMP/necto-pages/demo/fixtures"
      - uses: actions/configure-pages@v5
      - name: Set artifact name
        id: artifact
        run: echo "name=$PAGES_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/necto-pages
          name: ${{ steps.artifact.outputs.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          for attempt in {1..12}; do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -X GET -f name="$ARTIFACT_NAME" --jq '.total_count') &&
               [[ "$count" == 1 ]]; then
              exit 0
            fi
            if [[ "$attempt" != 12 ]]; then sleep 5; fi
          done
          echo "::error::Pages artifact '$ARTIFACT_NAME' is not available for this run."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
