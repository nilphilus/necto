name: UI checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: pnpm --dir Necto.UI install --frozen-lockfile
      - run: node --test Necto.UI/src/features/*/*.test.js tools/scenario-skill.test.mjs
      - run: pnpm --dir Necto.UI run build
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/necto-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/necto-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify core browser workflows
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/necto-browser/node_modules/playwright"
          for flow in openapi-content scenario-intuitive-flow scenario-library scenario-local-steps scenario-folder scenario-edge-routing; do
            node "Necto.UI/tests/$flow.e2e.cjs"
          done
